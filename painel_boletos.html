<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Boletos — TSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #F4F6F9;
    --panel: #FFFFFF;
    --panel-2: #F8FAFB;
    --line: #E2E7EF;
    --line-strong: #D2D9E4;
    --text: #10151F;
    --text-dim: #5C6776;
    --faint: #94A0B0;
    --accent: #009035;
    --daycoval: #2F6DF0;
    --itau: #E08A28;
    --sofisa: #0D9488;
    --transpocred: #8B46D6;
    --original: #C2418F;
    --danger: #E30016;
    --warn: #C98A15;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,22,38,.04), 0 8px 24px -12px rgba(16,22,38,.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  header{
    padding:22px 32px 20px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand-logo{ height:28px; width:auto; display:block; }
  .brand-title{ display:flex; flex-direction:column; gap:3px; padding-left:16px; border-left:1px solid var(--line); }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  header h1{
    margin:0; font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:600; letter-spacing:-0.01em; color:var(--text);
  }
  header .updated{ color:var(--text-dim); font-size:13px; font-variant-numeric: tabular-nums; }

  .summary{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:12px; padding:20px 32px; border-bottom:1px solid var(--line);
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .card .label{ font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
  .card .value{ font-size:22px; font-weight:600; font-variant-numeric: tabular-nums; }
  .card .sub{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .card.total .value{ color:var(--accent); }

  .tabs{
    display:flex; gap:6px; padding:16px 32px 0; flex-wrap:wrap;
  }
  .tab{
    padding:9px 16px; border-radius:8px 8px 0 0; cursor:pointer;
    color:var(--text-dim); font-size:14px; font-weight:500;
    border:1px solid transparent; border-bottom:none;
    display:flex; align-items:center; gap:8px;
  }
  .tab .dot{ width:8px; height:8px; border-radius:50%; }
  .tab.active{
    background:var(--panel); color:var(--text); border-color:var(--line);
  }

  .toolbar{
    background:var(--panel); border:1px solid var(--line); border-top:none;
    margin:0 32px; padding:14px 16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=text]{
    flex:1; min-width:200px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:8px; color:var(--text); padding:9px 12px; font-size:14px;
  }
  .toolbar select{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 12px; font-size:14px;
  }
  .toolbar .count{ color:var(--text-dim); font-size:13px; white-space:nowrap; }
  .toolbar .daterange{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); white-space:nowrap; }
  .toolbar .daterange input[type=date]{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:8px 10px; font-size:13px; font-family:inherit; color-scheme: light;
  }
  .export-btn{
    background:var(--accent); color:#FFFFFF; border:none; border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .export-btn:hover{ filter:brightness(1.08); }
  .export-btn:disabled{ opacity:.5; cursor:default; }

  .filtered-summary{
    margin:10px 32px 0; padding:12px 16px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel-2); display:flex; flex-wrap:wrap; gap:18px; align-items:center;
    font-size:13px; color:var(--text-dim);
  }
  .filtered-summary.hidden{ display:none; }
  .filtered-summary b{ color:var(--text); font-variant-numeric: tabular-nums; }
  .filtered-summary .fs-item{ display:flex; align-items:center; gap:6px; }
  .filtered-summary .fs-dot{ width:8px; height:8px; border-radius:50%; }

  .table-wrap{
    margin:0 32px 32px; border:1px solid var(--line); border-top:none;
    background:var(--panel); border-radius:0 0 var(--radius) var(--radius);
    overflow:auto; max-height:70vh; box-shadow:var(--shadow);
  }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    position:sticky; top:0; background:var(--panel-2); text-align:left;
    padding:10px 14px; font-weight:600; color:var(--text-dim); font-size:12.5px;
    border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  thead th:hover{ color:var(--text); }
  tbody td{
    padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
    color:var(--text);
  }
  tbody tr:hover{ background:var(--panel-2); }
  .col-check{ width:34px; text-align:center; padding-left:14px !important; padding-right:0 !important; }
  .col-check input{ cursor:pointer; width:15px; height:15px; }
  .num{ text-align:right; font-variant-numeric: tabular-nums; }
  .status-pill{
    display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600;
  }
  .status-vencer{ background:rgba(0,144,53,.12); color:var(--accent); }
  .status-vencido{ background:rgba(227,0,22,.10); color:var(--danger); }
  .status-breve{ background:rgba(201,138,21,.15); color:var(--warn); }
  .status-outro{ background:rgba(92,103,118,.10); color:var(--text-dim); }

  .empty{ padding:40px; text-align:center; color:var(--text-dim); }
  .loading{ padding:40px; text-align:center; color:var(--text-dim); }

  footer{ padding:20px 32px 40px; color:var(--text-dim); font-size:12px; }

  @media (max-width:720px){
    header, .summary, .tabs, footer{ padding-left:16px; padding-right:16px; }
    .toolbar, .table-wrap{ margin-left:16px; margin-right:16px; }
  }

  #backToTopBtn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;
    background:var(--primary);color:#fff;border:0;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;opacity:0;pointer-events:none;
    transform:translateY(8px);transition:opacity .18s,transform .18s;z-index:999}
  #backToTopBtn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  #backToTopBtn:hover{filter:brightness(1.08)}
  #backToTopBtn svg{width:20px;height:20px}
</style>
</head>

// Normaliza um cabeçalho: remove acento, colapsa espaços, minúsculas, sem
// espaço nas pontas. Usado tanto nos cabeçalhos da planilha quanto nas
// "keys" acima, pra casar mesmo com espaços extras/maiúsculas diferentes.
// Escapa qualquer valor que venha da planilha antes de inserir como HTML.
// A planilha é só sua, mas isso evita que um texto colado ali (por exemplo
// um nome de sacado com caracteres de HTML) vire código executável na tela
// de quem estiver vendo o painel.
function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function normHeader(s){
  return (s || "").toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "")
    .trim()
    .toLowerCase();
}

// JSONP via <script>: não passa por CORS, então funciona mesmo dentro de um
// iframe com origem "null" (como o data: URI usado no painel central).
function jsonpGviz(sheetName){
  return new Promise((resolve, reject) => {
    const cb = "__gv" + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&headers=1&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    const s = document.createElement("script");
    let done = false;
    const cleanup = () => { try { delete window[cb]; } catch(e) { window[cb] = undefined; } s.remove(); };
    window[cb] = (obj) => { done = true; cleanup(); resolve(obj); };
    s.onerror = () => { if (!done) { cleanup(); reject(new Error("script")); } };
    s.src = url;
    document.head.appendChild(s);
    setTimeout(() => { if (!done) { cleanup(); reject(new Error("timeout")); } }, 15000);
  });
}

function parseMoney(v){
  if (typeof v === "number") return v;
  if (!v) return 0;
  const s = String(v).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3},)/g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmtMoney(n){
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

// Aceita "dd/mm/yyyy" (formato que o gviz devolve pra colunas de data) e
// também objetos Date, caso o gviz não tenha formatado.
function parseBRDate(v){
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return isNaN(d) ? null : d;
}

// Situação inteligente calculada a partir da data de vencimento: vencido,
// vence em breve, ou a vencer. Não depende da coluna "Status" da planilha
// (que em algumas abas vem sempre "a vencer", mesmo pra boleto vencido).
function situacao(dateVal){
  const venc = parseBRDate(dateVal);
  if (!venc) return { label: "—", cls: "status-outro", key: "" };
  const today = new Date(); today.setHours(0,0,0,0);
  venc.setHours(0,0,0,0);
  const diffDays = Math.round((venc - today) / 86400000);
  if (diffDays < 0) return { label: `Vencido há ${-diffDays}d`, cls: "status-vencido", key: "vencido" };
  if (diffDays <= DIAS_VENCE_EM_BREVE) {
    const label = diffDays === 0 ? "Vence hoje" : `Vence em ${diffDays}d`;
    return { label, cls: "status-breve", key: "breve" };
  }
  return { label: "A Vencer", cls: "status-vencer", key: "avencer" };
}

// Agrupa a soma dos boletos por filial (100, 200, etc.), sem alterar o
// total geral — é só uma quebra a mais pra saber quanto é de cada filial.
function breakdownByFilial(rows, conf){
  const byFilial = {};
  rows.forEach(r => {
    const f = (conf.filialCol && r[conf.filialCol] !== undefined && r[conf.filialCol] !== "") ? String(r[conf.filialCol]) : "—";
    if (!byFilial[f]) byFilial[f] = { count: 0, sum: 0 };
    byFilial[f].count += 1;
    byFilial[f].sum += parseMoney(r[conf.valueCol]);
  });
  return byFilial;
}

// Mesma ideia, mas agrupando pelo produto/tipo (ex: "Cessão Coobrigação" x
// "Cobrança Simples" no DAYCOVAL) — só entra na conta quando o banco tem
// essa coluna (conf.productCol).
function breakdownByProduct(rows, conf){
  if (!conf.productCol) return {};
  const byProduct = {};
  rows.forEach(r => {
    const p = (r[conf.productCol] !== undefined && r[conf.productCol] !== "") ? String(r[conf.productCol]) : "—";
    if (!byProduct[p]) byProduct[p] = { count: 0, sum: 0 };
    byProduct[p].count += 1;
    byProduct[p].sum += parseMoney(r[conf.valueCol]);
  });
  return byProduct;
}

async function loadBank(bank){
  if (cache[bank]) return cache[bank];
  const conf = BANKS[bank];
  const json = await jsonpGviz(conf.sheetName);
  const cols = json.table.cols.map(c => normHeader(c.label));
  const rows = json.table.rows.map((r, i) => {
    const obj = { __id: i };
    cols.forEach((key, i2) => {
      const cell = r.c[i2];
      if (!cell) { obj[key] = ""; return; }
      if (cell.f !== undefined && cell.f !== null && cell.f !== "") {
        obj[key] = cell.f; // formatted value quando disponível (datas etc.)
      } else {
        obj[key] = cell.v;
      }
    });
    return obj;
  });
  cache[bank] = rows;
  return rows;
}

function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(BANKS).forEach(bank => {
    const el = document.createElement("div");
    el.className = "tab" + (bank === currentBank ? " active" : "");
    el.innerHTML = `<span class="dot" style="background:${BANKS[bank].color}"></span>${bank}`;
    el.onclick = () => {
      currentBank = bank;
      document.getElementById("search").value = "";
      document.getElementById("dateFrom").value = "";
      document.getElementById("dateTo").value = "";
      document.getElementById("productFilter").value = "";
      document.getElementById("filialFilter").value = "";
      renderTabs();
      renderTable();
    };
    tabsEl.appendChild(el);
  });
}

function renderSummary(){
  const summaryEl = document.getElementById("summary");
  summaryEl.innerHTML = "";

  let grandTotal = 0, grandCount = 0, grandVencidos = 0;
  const grandByFilial = {};
  Object.keys(BANKS).forEach(bank => {
    const t = allTotals[bank];
    if (t) {
      grandTotal += t.sum; grandCount += t.count; grandVencidos += t.vencidos;
      Object.entries(t.byFilial || {}).forEach(([f, v]) => {
        if (!grandByFilial[f]) grandByFilial[f] = { count: 0, sum: 0 };
        grandByFilial[f].count += v.count;
        grandByFilial[f].sum += v.sum;
      });
    }
  });

  const totalCard = document.createElement("div");
  totalCard.className = "card total";
  totalCard.innerHTML = `<div class="label">Total geral em aberto</div>
    <div class="value">${fmtMoney(grandTotal)}</div>
    <div class="sub">${grandCount} boletos, ${Object.keys(BANKS).length} bancos${grandVencidos ? ` · <span style="color:var(--danger)">${grandVencidos} vencido(s)</span>` : ""}</div>
    ${filialBreakdownHtml(grandByFilial)}`;
  summaryEl.appendChild(totalCard);

  Object.keys(BANKS).forEach(bank => {
    const t = allTotals[bank];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="label" style="color:${BANKS[bank].color}">${bank}</div>
      <div class="value">${t ? fmtMoney(t.sum) : "…"}</div>
      <div class="sub">${t ? t.count + " boletos" + (t.vencidos ? ` · <span style="color:var(--danger)">${t.vencidos} vencido(s)</span>` : "") : "carregando"}</div>
      ${t ? filialBreakdownHtml(t.byFilial) : ""}
      ${t ? productBreakdownHtml(t.byProduct) : ""}`;
    summaryEl.appendChild(card);
  });
}

// Só mostra a linha de quebra por filial quando há mais de uma filial —
// se só existe a 200, por exemplo, não faz sentido repetir a mesma soma.
function filialBreakdownHtml(byFilial){
  const filiais = Object.keys(byFilial || {});
  if (filiais.length < 2) return "";
  filiais.sort();
  const parts = filiais.map(f => `Filial ${escapeHtml(f)}: <b>${fmtMoney(byFilial[f].sum)}</b>`);
  return `<div class="sub" style="margin-top:4px">${parts.join(" · ")}</div>`;
}

// Quebra por produto (ex: Cessão Coobrigação x Cobrança Simples no
// DAYCOVAL, Cobrança Simples x Cobrança Vinculada na SOFISA).
function productBreakdownHtml(byProduct){
  const produtos = Object.keys(byProduct || {});
  if (produtos.length < 2) return "";
  produtos.sort();
  const parts = produtos.map(p => `${escapeHtml(p)}: <b>${fmtMoney(byProduct[p].sum)}</b>`);
  return `<div class="sub" style="margin-top:4px">${parts.join(" · ")}</div>`;
}

function applyFilters(rows, conf){
  const search = document.getElementById("search").value.trim().toLowerCase();
  const statusFilter = document.getElementById("statusFilter").value;
  const productFilter = document.getElementById("productFilter").value;
  const filialFilter = document.getElementById("filialFilter").value;
  const dateFrom = parseISODate(document.getElementById("dateFrom").value);
  const dateTo = parseISODate(document.getElementById("dateTo").value);
  return rows.filter(r => {
    if (statusFilter && situacao(r[conf.dateCol]).key !== statusFilter) return false;
    if (productFilter && conf.productCol && r[conf.productCol] !== productFilter) return false;
    if (filialFilter && conf.filialCol && String(r[conf.filialCol]) !== filialFilter) return false;
    if (dateFrom || dateTo) {
      const venc = parseBRDate(r[conf.dateCol]);
      if (!venc) return false;
      if (dateFrom && venc < dateFrom) return false;
      if (dateTo && venc > dateTo) return false;
    }
    if (!search) return true;
    return conf.columns.some(c => c.type !== "situacao" && String(r[c.key] || "").toLowerCase().includes(search));
  });
}

// input[type=date] devolve "yyyy-mm-dd"
function parseISODate(s){
  if (!s) return null;
  const [y, m, d] = s.split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

// Resumo da seleção atual (busca + situação + datas): soma separada por
// vencido / vence em breve / a vencer. Isso é só sobre o que está filtrado
// na tela — os cards "Total geral" no topo continuam com o total completo.
function renderFilteredSummary(rows, hasActiveFilter){
  const el = document.getElementById("filteredSummary");
  if (!hasActiveFilter || !rows.length) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.classList.remove("hidden");
  const conf = BANKS[currentBank];
  const groups = { vencido: { count: 0, sum: 0 }, breve: { count: 0, sum: 0 }, avencer: { count: 0, sum: 0 } };
  let total = 0;
  rows.forEach(r => {
    const v = parseMoney(r[conf.valueCol]);
    total += v;
    const k = situacao(r[conf.dateCol]).key;
    if (groups[k]) { groups[k].count += 1; groups[k].sum += v; }
  });
  el.innerHTML = `
    <span class="fs-item"><b>${rows.length}</b> boleto(s) nesta seleção · <b>${fmtMoney(total)}</b></span>
    <span class="fs-item"><span class="fs-dot" style="background:var(--danger)"></span>Vencido: <b>${groups.vencido.count}</b> · <b>${fmtMoney(groups.vencido.sum)}</b></span>
    <span class="fs-item"><span class="fs-dot" style="background:var(--warn)"></span>Vence em breve: <b>${groups.breve.count}</b> · <b>${fmtMoney(groups.breve.sum)}</b></span>
    <span class="fs-item"><span class="fs-dot" style="background:var(--accent)"></span>A Vencer: <b>${groups.avencer.count}</b> · <b>${fmtMoney(groups.avencer.sum)}</b></span>`;
}

function populateStatusFilter(){
  const sel = document.getElementById("statusFilter");
  const prev = sel.value;
  sel.style.display = "";
  sel.innerHTML = `
    <option value="">Todas as situações</option>
    <option value="vencido">Vencido</option>
    <option value="breve">Vence em breve</option>
    <option value="avencer">A Vencer</option>`;
  if (["vencido","breve","avencer"].includes(prev)) sel.value = prev;
}

function populateProductFilter(rows, conf){
  const sel = document.getElementById("productFilter");
  if (!conf.productCol) { sel.style.display = "none"; sel.value = ""; return; }
  const prev = sel.value;
  sel.style.display = "";
  const values = [...new Set(rows.map(r => r[conf.productCol]).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos os produtos</option>' +
    values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  if (values.includes(prev)) sel.value = prev;
}

function populateFilialFilter(rows, conf){
  const sel = document.getElementById("filialFilter");
  const values = [...new Set(rows.map(r => (conf.filialCol ? r[conf.filialCol] : "")).filter(v => v !== undefined && v !== ""))].sort();
  if (!conf.filialCol || values.length < 2) { sel.style.display = "none"; sel.value = ""; return; }
  const prev = sel.value;
  sel.style.display = "";
  sel.innerHTML = '<option value="">Todas as filiais</option>' +
    values.map(v => `<option value="${escapeHtml(v)}">Filial ${escapeHtml(v)}</option>`).join("");
  if (values.map(String).includes(prev)) sel.value = prev;
}

async function renderTable(){
  const conf = BANKS[currentBank];
  const loadingEl = document.getElementById("loadingMsg");
  const headRow = document.getElementById("headRow");
  const bodyRows = document.getElementById("bodyRows");
  const rowCount = document.getElementById("rowCount");

  loadingEl.style.display = "block";
  bodyRows.innerHTML = "";
  headRow.innerHTML = "";

  let rows;
  try {
    rows = await loadBank(currentBank);
  } catch (e) {
    loadingEl.textContent = "Não foi possível carregar os dados. Confira se a planilha está compartilhada como 'Qualquer pessoa com o link'.";
    return;
  }

  // compute totals once per bank
  if (!allTotals[currentBank]) {
    const sum = rows.reduce((acc, r) => acc + parseMoney(r[conf.valueCol]), 0);
    const vencidos = rows.filter(r => situacao(r[conf.dateCol]).key === "vencido").length;
    const byFilial = breakdownByFilial(rows, conf);
    const byProduct = breakdownByProduct(rows, conf);
    allTotals[currentBank] = { count: rows.length, sum, vencidos, byFilial, byProduct };
    renderSummary();
  }

  populateStatusFilter();
  populateProductFilter(rows, conf);
  populateFilialFilter(rows, conf);

  if (!selectedRows[currentBank]) selectedRows[currentBank] = new Set();

  const thCheck = document.createElement("th");
  thCheck.className = "col-check";
  const selectAll = document.createElement("input");
  selectAll.type = "checkbox";
  selectAll.id = "selectAll";
  thCheck.appendChild(selectAll);
  headRow.appendChild(thCheck);

  conf.columns.forEach(c => {
    const th = document.createElement("th");
    th.textContent = c.label;
    if (c.type === "money") th.style.textAlign = "right";
    headRow.appendChild(th);
  });

  const filtered = applyFilters(rows, conf);
  rowCount.textContent = `${filtered.length} de ${rows.length} boletos`;

  const search = document.getElementById("search").value.trim();
  const statusFilter = document.getElementById("statusFilter").value;
  const productFilter = document.getElementById("productFilter").value;
  const filialFilter = document.getElementById("filialFilter").value;
  const dateFrom = document.getElementById("dateFrom").value;
  const dateTo = document.getElementById("dateTo").value;
  const hasActiveFilter = !!(search || statusFilter || productFilter || filialFilter || dateFrom || dateTo);
  renderFilteredSummary(filtered, hasActiveFilter);
  lastFiltered = { rows: filtered, conf, bank: currentBank, hasActiveFilter };

  selectAll.checked = filtered.length > 0 && filtered.every(r => selectedRows[currentBank].has(r.__id));
  selectAll.addEventListener("change", () => {
    filtered.forEach(r => {
      if (selectAll.checked) selectedRows[currentBank].add(r.__id);
      else selectedRows[currentBank].delete(r.__id);
    });
    renderTable();
  });

  if (filtered.length === 0) {
    loadingEl.style.display = "none";
    bodyRows.innerHTML = `<tr><td colspan="${conf.columns.length + 1}"><div class="empty">Nenhum boleto encontrado com esse filtro.</div></td></tr>`;
    return;
  }

  // ordena: vencidos primeiro, depois vence-em-breve, depois o resto por vencimento
  const ORDER = { vencido: 0, breve: 1, avencer: 2, "": 3 };
  filtered.sort((a, b) => {
    const sa = situacao(a[conf.dateCol]), sb = situacao(b[conf.dateCol]);
    if (ORDER[sa.key] !== ORDER[sb.key]) return ORDER[sa.key] - ORDER[sb.key];
    const da = parseBRDate(a[conf.dateCol]), db = parseBRDate(b[conf.dateCol]);
    if (da && db) return da - db;
    return 0;
  });

  const frag = document.createDocumentFragment();
  filtered.forEach(r => {
    const tr = document.createElement("tr");
    const tdCheck = document.createElement("td");
    tdCheck.className = "col-check";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selectedRows[currentBank].has(r.__id);
    cb.addEventListener("change", () => {
      if (cb.checked) selectedRows[currentBank].add(r.__id);
      else selectedRows[currentBank].delete(r.__id);
      updateExportLabel();
      selectAll.checked = filtered.every(rr => selectedRows[currentBank].has(rr.__id));
    });
    tdCheck.appendChild(cb);
    tr.appendChild(tdCheck);
    conf.columns.forEach(c => {
      const td = document.createElement("td");
      if (c.type === "situacao") {
        const s = situacao(r[conf.dateCol]);
        td.innerHTML = `<span class="status-pill ${s.cls}">${s.label}</span>`;
      } else if (c.type === "money") {
        td.className = "num";
        td.textContent = fmtMoney(parseMoney(r[c.key]));
      } else {
        const val = r[c.key];
        td.textContent = val === undefined || val === null || val === "" ? "—" : val;
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  bodyRows.appendChild(frag);
  loadingEl.style.display = "none";
  updateExportLabel();
}

async function preloadTotals(){
  for (const bank of Object.keys(BANKS)) {
    try {
      const rows = await loadBank(bank);
      const conf = BANKS[bank];
      const sum = rows.reduce((acc, r) => acc + parseMoney(r[conf.valueCol]), 0);
      const vencidos = rows.filter(r => situacao(r[conf.dateCol]).key === "vencido").length;
      const byFilial = breakdownByFilial(rows, conf);
      const byProduct = breakdownByProduct(rows, conf);
      allTotals[bank] = { count: rows.length, sum, vencidos, byFilial, byProduct };
    } catch (e) {
      allTotals[bank] = null;
    }
  }
  renderSummary();
}

// Atualiza o texto do botão de exportar com quantos boletos estão marcados
// nesta aba, pra ficar claro o que vai sair no Excel.
function updateExportLabel(){
  const btn = document.getElementById("exportBtn");
  const n = (selectedRows[currentBank] || new Set()).size;
  btn.textContent = n > 0 ? `⬇ Exportar selecionados (${n})` : "⬇ Exportar Excel";
}

// Exporta as linhas atualmente filtradas (na aba do banco ativo) para um
// .xlsx que o Henrique pode abrir e mexer no Excel. Se houver boletos
// marcados com a caixa de seleção, exporta só esses; senão, exporta tudo
// que está filtrado na tela. Valor sai como número (não texto formatado)
// pra dar pra somar/fazer fórmula direto na planilha.
function exportToExcel(){
  const { conf, bank, hasActiveFilter } = lastFiltered;
  const selected = selectedRows[bank];
  const usingSelection = selected && selected.size > 0;
  const rows = usingSelection
    ? (cache[bank] || []).filter(r => selected.has(r.__id))
    : lastFiltered.rows;
  if (!rows || !rows.length) return;

  const headers = conf.columns.map(c => c.label);
  const data = rows.map(r => conf.columns.map(c => {
    if (c.type === "situacao") return situacao(r[conf.dateCol]).label;
    if (c.type === "money") return parseMoney(r[c.key]);
    const v = r[c.key];
    return (v === undefined || v === null) ? "" : v;
  }));

  const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
  // largura de coluna aproximada pra ficar legível
  ws["!cols"] = headers.map((h, i) => ({ wch: Math.max(h.length + 2, 14) }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, bank.slice(0, 31));

  const stamp = new Date().toISOString().slice(0, 10);
  const suffix = usingSelection ? "_selecionados" : (hasActiveFilter ? "_filtrado" : "");
  XLSX.writeFile(wb, `Boletos_${bank}${suffix}_${stamp}.xlsx`);
}

document.getElementById("exportBtn").addEventListener("click", exportToExcel);
document.getElementById("search").addEventListener("input", renderTable);

document.getElementById("statusFilter").addEventListener("change", renderTable);
document.getElementById("productFilter").addEventListener("change", renderTable);
document.getElementById("filialFilter").addEventListener("change", renderTable);
document.getElementById("dateFrom").addEventListener("change", renderTable);
document.getElementById("dateTo").addEventListener("change", renderTable);

renderTabs();
renderSummary();
preloadTotals();
renderTable();
document.getElementById("updatedAt").textContent = "Atualizado em " + new Date().toLocaleString("pt-BR");
</script>
