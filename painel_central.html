<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painéis Financeiros — Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F9;--bar:#FFFFFF;--line:#E2E7EF;--ink:#10151F;--muted:#5C6776;
    --primary:#009035;--primary-ink:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{background:var(--bar);border-bottom:1px solid var(--line);
    padding:14px 20px 0;flex:none}
  .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .title-row .brand{display:flex;align-items:center;gap:12px}
  .title-row .brand img{height:22px;width:auto;display:block}
  .title-row .brand .div{width:1px;align-self:stretch;background:var(--line)}
  .title-row h1{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:9px;color:var(--ink)}
  .title-row .hint{font-size:12px;color:var(--muted)}

  nav.tabs{display:flex;gap:4px}
  nav.tabs button{
    background:transparent;border:0;color:var(--muted);font:inherit;font-size:13.5px;font-weight:700;
    padding:11px 18px;cursor:pointer;border-radius:10px 10px 0 0;position:relative;top:1px;
    transition:color .15s;display:flex;align-items:center;gap:8px}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-bottom-color:var(--bg);box-shadow:inset 0 2px 0 var(--primary)}
  nav.tabs button .dot{width:6px;height:6px;border-radius:50%;flex:none}

  main{flex:1;min-height:0;position:relative;background:var(--bg)}
  .frame-wrap{position:absolute;inset:0;display:none}
  .frame-wrap.active{display:block}
  iframe{width:100%;height:100%;border:0;display:block;background:#F4F6F9}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;font-weight:600;gap:10px;background:var(--bg)}
  .loading .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--primary);animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .credit-bar{flex:none;text-align:center;font-size:10.5px;color:#EAF0FF;padding:5px 12px;
    background:#3B6BF6;letter-spacing:.01em}
  .credit-bar strong{color:#FFFFFF;font-weight:700}

  .title-row-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .present-btn{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:7px 14px;
    font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;
    gap:6px;white-space:nowrap;transition:background .15s,filter .15s}
  .present-btn:hover{filter:brightness(1.08)}
  .present-btn.active{background:#b91c1c}
  header{position:relative}
  .present-progress{position:absolute;left:0;bottom:0;height:3px;width:0%;background:var(--primary);z-index:5}
  body.presenting .credit-bar{display:none}

  .frame-wrap{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease}
  .frame-wrap.active{opacity:1;visibility:visible;pointer-events:auto}

  .present-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;
    align-items:center;gap:4px;background:var(--bar);border:1px solid var(--line);border-radius:999px;
    padding:7px 8px;box-shadow:0 14px 34px rgba(16,22,38,.22);z-index:1000}
  body.presenting .present-controls{display:flex}
  .present-controls button{background:transparent;border:0;color:var(--ink);font-size:16px;cursor:pointer;
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .15s}
  .present-controls button:hover{background:var(--bg)}
  .present-controls select{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:inherit;
    font-size:12px;font-weight:600;background:var(--bg);color:var(--ink);cursor:pointer}
  .present-controls .present-exit{width:auto;background:#b91c1c;color:#fff;border-radius:999px;
    padding:0 14px;font-size:12px;font-weight:700}
  .present-controls .present-exit:hover{background:#991515}

  #lockScreen{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
  body.unlocked #lockScreen{display:none}
  .lock-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 30px 26px;width:100%;max-width:380px;
    box-shadow:0 20px 50px -20px rgba(16,22,38,.25);text-align:center}
  .lock-card img{height:30px;width:auto;margin-bottom:18px}
  .lock-card h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin:0 0 4px;color:var(--ink)}
  .lock-card p{font-size:13px;color:var(--muted);margin:0 0 18px}
  .lock-card input{width:100%;font:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);outline:none;text-align:center;letter-spacing:.04em}
  .lock-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,144,53,.15)}
  .lock-card button{width:100%;margin-top:12px;font:inherit;font-size:14px;font-weight:700;padding:11px;border:0;border-radius:10px;
    background:var(--primary);color:#fff;cursor:pointer}
  .lock-card button:disabled{opacity:.6;cursor:wait}
  .lock-err{color:#b91c1c;font-size:12.5px;font-weight:600;min-height:18px;margin-top:10px}
  body:not(.unlocked) header,body:not(.unlocked) main,body:not(.unlocked) .credit-bar{visibility:hidden}
</style>
</head>

const KDF_SALT = "ydUxe1xAgIuWUM7MwiTYJw==";
const KDF_ITER = 200000;
const loaded = [false, false, false, false];
const decCache = {};
let aesKey = null;

function b64ToBytes(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function bytesToB64(u){ let s=""; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }

async function deriveKey(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64ToBytes(KDF_SALT), iterations:KDF_ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptPanel(i){
  if(decCache[i]) return decCache[i];
  const raw = b64ToBytes(ENC[i]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(0,12)}, aesKey, raw.slice(12));
  decCache[i] = new TextDecoder().decode(buf);
  return decCache[i];
}

function showTab(i){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", +b.dataset.i===i));
  document.querySelectorAll(".frame-wrap").forEach(w=>w.classList.toggle("active", +w.dataset.i===i));
  ensureLoaded(i);
}
async function ensureLoaded(i){
  if(loaded[i] || !aesKey) return;
  loaded[i] = true;
  const ifr = document.getElementById("if"+i);
  ifr.addEventListener("load", ()=>{
    const l = document.getElementById("load"+i);
    if(l) l.style.display = "none";
  }, {once:true});
  try{ ifr.src = await decryptPanel(i); }catch(e){ loaded[i] = false; }
}

async function tryUnlock(pass){
  const key = await deriveKey(pass);
  aesKey = key;
  try{ await decryptPanel(0); }
  catch(e){ aesKey = null; delete decCache[0]; return false; }
  try{
    const raw = await crypto.subtle.exportKey("raw", key);
    sessionStorage.setItem("tsaKey", bytesToB64(new Uint8Array(raw)));
  }catch(e){}
  document.body.classList.add("unlocked");
  ensureLoaded(0);
  return true;
}
async function tryRestore(){
  let k = null;
  try{ k = sessionStorage.getItem("tsaKey"); }catch(e){}
  if(!k) return false;
  try{
    aesKey = await crypto.subtle.importKey("raw", b64ToBytes(k), "AES-GCM", false, ["decrypt"]);
    await decryptPanel(0);
    document.body.classList.add("unlocked");
    ensureLoaded(0);
    return true;
  }catch(e){
    aesKey = null; delete decCache[0];
    try{ sessionStorage.removeItem("tsaKey"); }catch(_){}
    return false;
  }
}
document.getElementById("lockForm").addEventListener("submit", async (ev)=>{
  ev.preventDefault();
  const inp = document.getElementById("lockPass"), btn = document.getElementById("lockBtn"), err = document.getElementById("lockErr");
  if(!inp.value) return;
  btn.disabled = true; err.textContent = "";
  let ok = false;
  try{ ok = await tryUnlock(inp.value); }catch(e){ ok = false; }
  btn.disabled = false;
  if(!ok){ err.textContent = "Senha incorreta."; inp.value = ""; inp.focus(); }
});
tryRestore();



// ── Modo Apresentação — alterna sozinho entre os painéis ───────────────────
let presenting = false;
let presentPaused = false;
let presentInterval = 20000;
let presentTimer = null;
let presentRAF = null;

function totalTabs(){ return document.querySelectorAll('nav.tabs button').length; }
function currentTab(){ return +document.querySelector('nav.tabs button.active').dataset.i; }
function presentGoTo(i){
  const total = totalTabs();
  showTab(((i % total) + total) % total);
}
function presentNext(){ presentGoTo(currentTab()+1); }
function presentPrev(){ presentGoTo(currentTab()-1); }

function scheduleProgress(){
  clearTimeout(presentTimer);
  cancelAnimationFrame(presentRAF);
  const bar = document.getElementById('presentProgress');
  if(bar) bar.style.width = '0%';
  const start = performance.now();
  function tick(now){
    const elapsed = now - start;
    const pct = Math.min(100, (elapsed/presentInterval)*100);
    if(bar) bar.style.width = pct + '%';
    if(presenting && !presentPaused && elapsed < presentInterval){ presentRAF = requestAnimationFrame(tick); }
  }
  presentRAF = requestAnimationFrame(tick);
  presentTimer = setTimeout(()=>{ if(presenting && !presentPaused){ presentNext(); scheduleProgress(); } }, presentInterval);
}

function startPresentation(){
  presenting = true; presentPaused = false;
  document.body.classList.add('presenting');
  const btn = document.getElementById('presentBtn');
  btn.textContent = '✕ Sair da apresentação';
  btn.classList.add('active');
  const pp = document.getElementById('presentPlayPause');
  if(pp) pp.textContent = '⏸';
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  scheduleProgress();
}
function stopPresentation(){
  presenting = false; presentPaused = false;
  document.body.classList.remove('presenting');
  clearTimeout(presentTimer);
  cancelAnimationFrame(presentRAF);
  const bar = document.getElementById('presentProgress');
  if(bar) bar.style.width = '0%';
  const btn = document.getElementById('presentBtn');
  btn.textContent = '▶ Apresentação';
  btn.classList.remove('active');
  if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(e){} }
}
function togglePause(){
  presentPaused = !presentPaused;
  const btn = document.getElementById('presentPlayPause');
  if(presentPaused){
    clearTimeout(presentTimer);
    cancelAnimationFrame(presentRAF);
    if(btn) btn.textContent = '▶';
  } else {
    if(btn) btn.textContent = '⏸';
    scheduleProgress();
  }
}

document.getElementById('presentBtn').addEventListener('click', ()=>{
  if(presenting){ stopPresentation(); } else { startPresentation(); }
});
document.getElementById('presentExit').addEventListener('click', stopPresentation);
document.getElementById('presentPlayPause').addEventListener('click', togglePause);
document.getElementById('presentNextBtn').addEventListener('click', ()=>{ presentNext(); if(presenting && !presentPaused) scheduleProgress(); });
document.getElementById('presentPrevBtn').addEventListener('click', ()=>{ presentPrev(); if(presenting && !presentPaused) scheduleProgress(); });
document.getElementById('presentSpeed').addEventListener('change', (e)=>{
  presentInterval = +e.target.value;
  if(presenting && !presentPaused) scheduleProgress();
});
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && presenting){ stopPresentation(); }
});
document.addEventListener('keydown', (e)=>{
  if(!presenting) return;
  if(e.key === 'Escape'){ stopPresentation(); }
  if(e.key === 'ArrowRight'){ presentNext(); scheduleProgress(); }
  if(e.key === 'ArrowLeft'){ presentPrev(); scheduleProgress(); }
});

document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    showTab(+b.dataset.i);
    if(presenting && !presentPaused) scheduleProgress();
  });
});
